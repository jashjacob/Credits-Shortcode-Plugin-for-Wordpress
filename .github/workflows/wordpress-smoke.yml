name: WordPress smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'credits_shortcode.php'
      - 'css/**'
      - 'js/**'
      - 'block.json'
      - '.cursor/**'
      - 'scripts/**'
      - '.github/workflows/wordpress-smoke.yml'
  push:
    branches:
      - master
    paths:
      - 'credits_shortcode.php'
      - 'css/**'
      - 'js/**'
      - 'block.json'
      - '.cursor/**'
      - 'scripts/**'

jobs:
  wordpress-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: credits_wp
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      WP_DB_HOST: 127.0.0.1
      WP_DB_NAME: credits_wp
      WP_DB_USER: root
      WP_DB_PASSWORD: root

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, mbstring, xml, curl, intl, zip
          coverage: none

      - name: Install MySQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq default-mysql-client

      - name: Composer install
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: WordPress install and smoke tests
        run: |
          chmod +x scripts/ci-wordpress-smoke.sh \
            .cursor/cloud-agent-verify.sh .cursor/cloud-agent-test-variations.sh
          bash scripts/ci-wordpress-smoke.sh
