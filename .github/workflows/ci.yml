name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Lint plugin
        run: php -l credits_shortcode.php

      - name: Run PHPUnit
        run: vendor/bin/phpunit

      - name: Verify WordPress.org release zip
        if: matrix.php == '8.3'
        run: bash scripts/build-wp-release.sh
